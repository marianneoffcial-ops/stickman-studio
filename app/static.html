<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickman Studio AI</title><style>
body{margin:0;background:#101318;color:#eee;font:16px system-ui}main{max-width:900px;margin:45px auto;padding:20px}.box{background:#1a2028;border:1px solid #39414a;border-radius:16px;padding:24px;margin:18px 0}h1{font-size:42px;margin:5px}label{display:block;margin:14px 0 6px}textarea,select{width:100%;padding:12px;background:#0d1117;color:white;border:1px solid #48515b;border-radius:8px}textarea{min-height:90px}button{margin-top:18px;padding:12px 20px;background:#d1b47b;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.muted{color:#aab3bd}a{color:#e2c58e}pre{white-space:pre-wrap}</style></head><body><main><section class="box"><small>CLOUD-FIRST · NO GPU REQUIRED</small><h1>Stickman Studio AI</h1><p class="muted">Turn a story idea into an animated stickman video. Rendering runs on the cloud server.</p></section>
<form id="f" class="box"><label>Video topic</label><textarea id="topic" required>A mysterious ancient seal breaks beneath a ruined northern tower.</textarea><label>Duration</label><select id="duration"><option value="30">30 seconds</option><option value="60" selected>1 minute</option><option value="180">3 minutes</option><option value="300">5 minutes</option></select><label>Aspect ratio</label><select id="ratio"><option>16:9</option></select><button id="go">Generate video</button></form>
<section id="out" class="box" hidden><h2 id="state">Queued</h2><p id="detail" class="muted"></p><a id="download"></a><h3>Scene plan</h3><pre id="plan"></pre></section></main>
<script>const f=document.querySelector('#f'),b=document.querySelector('#go'),topicEl=document.querySelector('#topic'),durationEl=document.querySelector('#duration'),ratioEl=document.querySelector('#ratio'),outEl=document.querySelector('#out'),planEl=document.querySelector('#plan'),stateEl=document.querySelector('#state'),detailEl=document.querySelector('#detail'),downloadEl=document.querySelector('#download');f.onsubmit=async e=>{e.preventDefault();b.disabled=true;const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topicEl.value,duration_seconds:+durationEl.value,aspect_ratio:ratioEl.value})});const d=await r.json();outEl.hidden=false;planEl.textContent=JSON.stringify(d.project.scenes,null,2);async function poll(){const x=await(await fetch('/api/jobs/'+d.job.job_id)).json();stateEl.textContent=x.status.toUpperCase();detailEl.textContent=x.error||'Cloud render is running…';if(x.status==='completed'){downloadEl.href=x.output;downloadEl.textContent='Download MP4';b.disabled=false}else if(x.status==='failed'){b.disabled=false}else setTimeout(poll,2500)}poll()}</script></body></html>
