name: Python validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app worker tests
      - run: python -c "import re; from pathlib import Path; page=Path('app/static.html').read_text(); Path('/tmp/stickman-ui.js').write_text(re.search(r'<script>(.*?)</script>', page, re.S).group(1))"
      - run: node --check /tmp/stickman-ui.js
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: stickman-render-smoke-sample
          path: artifacts/smoke/
          retention-days: 1
